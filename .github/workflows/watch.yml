name: hyrox-paris-watch
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test: {description: "Send test push", type: boolean, default: false}
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python watch.py ${{ inputs.test && '--test' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Persist state
        run: |
          git config user.name watcher; git config user.email watcher@users.noreply.github.com
          git add -A; git diff --cached --quiet || (git commit -m "state" && git push)
